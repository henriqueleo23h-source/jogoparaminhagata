<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#06070a">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arquivo Noturno</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<style>
:root{box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#06070a;--ink:#f2f2f2;--muted:#a8abb3;--red:#c4101c;--card:#11141b;--line:#ffffff24;--ok:#5cb985;--bad:#e0705d;--gold:#e8b93a}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1,h2{font-weight:800;line-height:1.15;margin:0}
h1{font-size:1.9rem}h2{font-size:1.5rem;margin:12px 0 6px}
.hero{position:relative;overflow:hidden;border-radius:14px;padding:30px 16px 210px;text-align:center}
.hero>svg{position:absolute;left:0;bottom:0;width:100%;height:230px}
.hero:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(#06070a 35%,#06070a00 75%)}
.hero>*:not(svg){position:relative;z-index:2}
.hero p{color:var(--muted);margin:10px 0 18px}
.cta{display:inline-block;text-decoration:none;color:#fff;border:0;border-radius:999px;padding:16px 38px;font-weight:600;text-transform:uppercase;background:linear-gradient(135deg,#d3101e,#7d0a12)}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:22px 0 14px}
.card{display:flex;flex-direction:column;gap:6px;padding:0 0 12px;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;font:inherit;overflow:hidden;cursor:pointer}
.card>*:not(.img){padding:0 12px}
.card .img svg{display:block;width:100%;height:110px}
.card strong{font-size:1.05rem;font-weight:800}
.card .tz{font-size:.8rem;color:var(--muted);flex:1}
.card .st{font-weight:600;color:var(--red)}
.card.cur{border-color:var(--red)}
.card.done{border-color:var(--ok)}.card.done .st{color:var(--ok)}
.card.lock{cursor:default;min-height:220px;align-items:center;justify-content:center;color:var(--muted);border-style:dashed}
.card .big{font-size:2.6rem;font-weight:800}
.meta{color:var(--muted);font-size:.85rem;margin:2px 0}
.gold{color:var(--gold)}
button{font:inherit}button:not(:disabled){cursor:pointer}
.btn{background:linear-gradient(135deg,#d3101e,#7d0a12);color:#fff;border:0;border-radius:999px;padding:11px 22px;font-weight:600;margin:6px 8px 4px 0}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn:disabled{opacity:.45}
a:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.himg svg{display:block;width:100%;height:230px;border-radius:14px}
.sc{font-size:1.1rem;border-left:4px solid var(--red);padding-left:14px;margin:10px 0 16px}
.ans{display:flex;gap:10px;align-items:baseline;margin:0 0 6px;padding:8px 12px;border-radius:8px;background:var(--card);border-left:4px solid var(--line)}
.ans b{min-width:78px}.a1{border-color:var(--ok)}.a1 b{color:var(--ok)}.a0{border-color:var(--bad)}.a0 b{color:var(--bad)}.a2 b{color:var(--muted)}
.qs{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.steps{display:flex;gap:4px;margin:14px 0 8px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps i.d{background:var(--ok)}.steps i.c{background:var(--red)}
h3{font-size:1.1rem;font-weight:800;margin:6px 0 10px}
.clue{background:#e9e0c6;color:#2a2418;border-radius:6px;padding:12px 14px;margin:0 0 10px;font-size:.95rem}.clue b{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;opacity:.7;margin-bottom:2px}
.small .ans{font-size:.85rem;padding:5px 10px}
.q:disabled{opacity:.4}.q{text-align:left;background:none;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.q:hover{border-color:#fff8}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.opt.ok{border-color:var(--ok)}.opt.bad{border-color:var(--bad);opacity:.6}
.stamp{border:3px solid var(--ok);color:var(--ok);font-weight:800;font-size:1.4rem;display:inline-block;padding:2px 14px;transform:rotate(-3deg);margin:12px 0}
.stamp.l{border-color:var(--bad);color:var(--bad)}
.hint{color:var(--bad);min-height:1.5em}
html{-webkit-text-size-adjust:100%}
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn,.q,.opt{min-height:48px}.btn{padding:12px 22px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;margin-top:-8px}
h3{scroll-margin-top:64px}
.himg svg{height:clamp(140px,38vw,230px)}
@media (max-width:480px){main{padding:12px 12px 32px}h1{font-size:1.5rem}h2{font-size:1.3rem}.hero{padding:22px 12px 180px}.hero>svg{height:200px}.cta{display:block;text-align:center}.deck{gap:10px}.card .img svg{height:96px}.sc{font-size:1rem}.clue{font-size:.92rem}.ans b{min-width:68px}}
</style>
</head>

`<rect x="6" y="2" width="38" height="50" fill="#8a6a1e"/><rect x="11" y="7" width="28" height="40" fill="#3b2f1c"/><ellipse cx="25" cy="22" rx="7" ry="9" fill="#9a7a4a"/><path d="M12 47c2-12 8-14 13-14s11 2 13 14z" fill="#2a2216"/>`,
`<path d="M2 58V30a23 23 0 0 1 46 0v28z" fill="#1b140c" stroke="#8a6a1e" stroke-width="3"/><path d="M12 58V32a13 13 0 0 1 26 0v26z" fill="#000"/><rect x="14" y="48" width="22" height="10" fill="#4f8f5f"/><rect x="16" y="42" width="18" height="6" fill="#5fa070"/>`,

`<path d="M2 28a23 23 0 0 1 46 0q-6-5-11.500 0t-11.500 0-11.500 0T2 28z" fill="#2a2f3a" stroke="#6b7785"/><path d="M25 28v28q0 6-6 6" fill="none" stroke="#6b7785" stroke-width="3"/><path d="M25 5V0" stroke="#6b7785" stroke-width="2"/>`,
`<rect x="12" y="2" width="26" height="9" rx="2" fill="#e8e8e8"/><rect x="8" y="11" width="34" height="46" rx="5" fill="#d8d0b8"/><rect x="12" y="24" width="26" height="22" fill="#b0402f"/><path d="M20 38h10" stroke="#fff" stroke-width="3"/>`];
IC.push(`<path d="M2 40h46l-8 14H10z" fill="#5a6a78"/><rect x="18" y="26" width="16" height="14" fill="#8a96a2"/><rect x="24" y="12" width="5" height="14" fill="#8a96a2"/><path d="M26 10V2M18 6l8-4 8 4" fill="none" stroke="#e0455a" stroke-width="2"/>`,
`<rect x="6" y="2" width="8" height="18" fill="#222"/><circle cx="10" cy="8" r="3" fill="#e0455a"/><rect x="2" y="28" width="46" height="22" rx="4" fill="#2b3a8f"/><rect x="8" y="32" width="10" height="8" fill="#cfe8f2"/><rect x="24" y="32" width="10" height="8" fill="#cfe8f2"/><circle cx="14" cy="54" r="5" fill="#222" stroke="#aaa"/><circle cx="36" cy="54" r="5" fill="#222" stroke="#aaa"/>`,
`<rect x="6" y="4" width="38" height="52" fill="#0b0f18" stroke="#c9a14a" stroke-width="5"/><path d="M12 12l5 3-5 3 5 3-5 3" fill="none" stroke="#e8e0cc" stroke-width="1.5"/>`);
const IMG=[0,1,2,3,4,5,6,7,8].map(k=>dos("Pasta de investigação do caso "+(k+1),IC[k],["1911","2005","1971","2006","1978","1982","1910","1963","1990"][k],"CONFIDENCIAL","ARQUIVO ["+(k+1)+"]"));
const ST=[
{t:"O Quadro Sumido",y:1911,l:"Paris",d:1,s:"Em 1911, a pintura mais famosa do mundo sumiu de um museu de Paris. A falta só foi notada no dia seguinte. Não havia arrombamento nem sinal de luta.",
q:[["Houve arrombamento?",0],["O ladrão conhecia o museu?",1],["Ele se vestiu de forma a não chamar atenção?",1],["Ele agiu com cúmplices armados?",0],["O museu estava aberto ao público naquele dia?",0],["A pintura foi recuperada?",1],["O ladrão foi pego logo?",0],["Ele tentou vender a obra?",1],["O dia estava chuvoso?",2]],
r:"Vincenzo Peruggia, que já havia trabalhado no museu, entrou vestido como os funcionários num dia em que o Louvre estava fechado ao público e saiu com a pintura. Foi preso em 1913, ao tentar vendê-la em Florença.",
w:["Um grupo armado rendeu os guardas e levou a obra num furgão.","A pintura foi trocada por uma cópia, e o roubo só apareceu décadas depois.","O diretor do museu a vendeu em segredo e fingiu o roubo."]},
{t:"O Túnel de Fortaleza",y:2005,l:"Fortaleza, Brasil",d:2,s:"Em agosto de 2005, funcionários do Banco Central de Fortaleza abriram o cofre numa segunda-feira e encontraram cerca de R$ 164 milhões a menos. As portas e os alarmes estavam intactos.",
q:[["Os ladrões entraram pela porta do banco?",0],["Alguém armado rendeu os funcionários?",0],["Eles passaram por baixo da terra?",1],["Usaram um imóvel próximo?",1],["Esse imóvel fingia ser outra coisa?",1],["O crime foi planejado em poucos dias?",0],["O banco ficou fechado durante o fim de semana?",1],["O dinheiro foi todo recuperado?",0],["Choveu naquele fim de semana?",2]],
r:"A quadrilha alugou uma casa perto do banco, montou ali uma falsa empresa de grama sintética e escavou por cerca de três meses um túnel de aproximadamente 80 metros até o cofre. Levaram o dinheiro no fim de semana, e só parte dele foi recuperada.",
w:["Um segurança abriu o cofre e dividiu o dinheiro, sem túnel nenhum.","Os ladrões entraram pelo duto de ventilação durante o expediente.","Um carro-forte falso levou o dinheiro durante uma transferência normal."]},
{t:"O Homem do Paraquedas",y:1971,l:"Estados Unidos",d:3,s:"Em 1971, um homem sequestrou um avião nos Estados Unidos e recebeu um resgate. Quando o avião pousou pela última vez, ele não estava mais a bordo. Nunca foi identificado.",
q:[["O avião pousou com ele a bordo?",0],["Ele saiu do avião durante o voo?",1],["Ele usava paraquedas?",1],["Ele ameaçou com uma bomba?",1],["Os passageiros foram feridos?",0],["O dinheiro foi todo encontrado?",0],["Ele foi identificado depois?",0],["Ele pediu que o avião decolasse de novo?",1],["A comissária usava uniforme azul?",2]],
r:"O homem, conhecido como Dan Cooper, ameaçou com uma bomba, trocou os passageiros por US$ 200 mil e paraquedas e fez o avião decolar de novo. Saltou pela escada traseira do Boeing 727 e nunca foi identificado.",
w:["Ele se misturou aos passageiros libertados e saiu pelo aeroporto.","Ele foi preso, mas o caso foi escondido pela polícia.","A bomba explodiu no ar e o avião caiu."]},
{t:"Carnaval no Museu",y:2006,l:"Rio de Janeiro, Brasil",d:4,s:"Numa tarde de sexta-feira de Carnaval, em 2006, foliões enchiam as ruas de um bairro do Rio. Quatro homens entraram num museu cercado de mata e, meia hora depois, sumiram com cinco quadros de artistas famosos. O caso nunca foi solucionado.",
q:[["O roubo foi feito de madrugada?",0],["Os ladrões estavam armados?",1],["Houve reféns?",1],["As câmeras do museu continuaram gravando o tempo todo?",0],["O Carnaval ajudou na fuga?",1],["Os ladrões levaram todo o acervo do museu?",0],["Todos os quadros foram recuperados?",0],["O caso foi solucionado?",0],["O museu ficava no alto de uma rampa?",2]],
r:"Quatro homens armados, com uma granada, entraram no museu da Chácara do Céu, em Santa Teresa, na tarde da sexta-feira de Carnaval de 2006. Renderam os seguranças, mandaram desligar as câmeras, fizeram turistas de reféns e, em cerca de meia hora, levaram um Dalí, um Matisse, um Monet e dois Picassos, fugindo aproveitando o movimento do Carnaval. O caso nunca foi solucionado e prescreveu 20 anos depois.",
w:["Eram funcionários do museu, que entraram de madrugada, sem armas e com as chaves.","Um grupo de turistas levou os quadros escondidos e foi preso no aeroporto.","Os quadros foram achados dias depois num apartamento, e os ladrões foram condenados."]},
{t:"A Picada na Ponte",y:1978,l:"Londres",d:4,s:"Em 1978, um escritor exilado esperava o ônibus numa ponte de Londres. Sentiu uma picada na perna e viu um homem se afastando. Quatro dias depois, estava morto.",
q:[["O homem o atacou com uma faca?",0],["Um objeto comum foi usado no ataque?",1],["O objeto servia para se proteger da chuva?",1],["Algo foi disparado para dentro do corpo?",1],["Era uma substância tóxica?",1],["O motivo foi político?",1],["O autor foi condenado?",0],["A vítima morreu na hora?",0],["A vítima usava chapéu?",2]],
r:"Georgi Markov foi atingido por uma esfera minúscula com ricina, disparada da ponta de um guarda-chuva. Morreu quatro dias depois. O ataque foi atribuído por investigadores ao serviço secreto da Bulgária, e ninguém foi condenado.",
w:["Uma aranha venenosa solta pelo assassino o picou.","O assassino injetou veneno com uma seringa escondida na mão.","Ele foi atropelado por um carro que fugiu."]},
{t:"Os Frascos de Chicago",y:1982,l:"Chicago",d:5,s:"Em 1982, várias pessoas sem relação entre si morreram em poucos dias na região de Chicago. Todas haviam tomado o mesmo remédio comum, comprado em lojas diferentes.",
q:[["Todas tomaram o mesmo produto?",1],["Elas se conheciam?",0],["O problema veio da fábrica?",0],["Alguém mexeu nos frascos depois que saíram da fábrica?",1],["Foi usado um veneno?",1],["O culpado foi condenado pelas mortes?",0],["O caso mudou o jeito de embalar remédios?",1],["A morte foi rápida?",1],["O remédio era caro?",2]],
r:"Alguém trocou cápsulas por outras com cianeto e devolveu os frascos às prateleiras. Sete pessoas morreram. O culpado nunca foi identificado, e o caso levou às embalagens com lacre de segurança.",
w:["A fábrica usou um ingrediente contaminado por engano.","Um funcionário da fábrica foi preso e condenado pelas mortes.","Uma epidemia de gripe causou as mortes, sem ligação com o remédio."]}];
const PN=["O caso","Cena do crime","Perícia policial","Investigação","Evidências","A solução"];
const PH=[
[{doc:"Ocorrência: o desaparecimento ocorreu numa segunda-feira, dia em que o museu estava fechado ao público. Na terça, 22 de agosto de 1911, o pintor Louis Béroud foi copiar o quadro e achou quatro pregos na parede. O guarda achou que a obra estava no estúdio de fotografia e só horas depois a falta foi confirmada. Na escada de serviço ao lado da galeria, a polícia achou a moldura e o vidro de proteção.",q:"O que o local onde a moldura foi achada indica?",o:["A obra foi tirada da moldura ali, perto de uma saída de serviço","O ladrão fugiu pela janela da galeria","A obra foi destruída e queimada na escada","O ladrão deixou a moldura e voltou ao museu"]},
{doc:"Laudo: a polícia colheu uma impressão digital na moldura e no vidro, mas não conseguiu ligá-la a ninguém. Na época, o arquivo policial francês ainda dependia do método de medidas de Bertillon e usava pouco as impressões digitais.",q:"Por que a impressão digital não levou ao ladrão de imediato?",o:["O arquivo ainda dependia do método de Bertillon e usava pouco as digitais","A impressão era de um guarda e foi descartada","O ladrão usou luvas, então não havia impressão","O vidro foi lavado antes da chegada da polícia"]},
{doc:"Investigação: a polícia interrogou o poeta Guillaume Apollinaire, ligado a um ex-secretário que roubara estatuetas do museu em 1907 e as vendera a Picasso. O pintor também foi interrogado. Os dois foram liberados por falta de provas, e por dois anos nenhuma pista séria apareceu.",q:"Por que Apollinaire entrou na lista de suspeitos?",o:["Estava ligado a um homem que já furtara estatuetas do mesmo museu","Trabalhava como guarda do museu","Foi visto saindo do museu com um embrulho","Havia pintado uma cópia da obra"]},
{doc:"Evidência: em dezembro de 1913, um marchand de Florença, Alfredo Geri, recebeu cartas oferecendo a obra por 500 mil liras e avisou o diretor da Galeria Uffizi, Giovanni Poggi. O vendedor mostrou a pintura num hotel, escondida no fundo falso de uma mala. Poggi conferiu o verso da tela.",q:"Qual detalhe permitiu confirmar a autenticidade quase de imediato?",o:["O carimbo e o número de catálogo do Louvre no verso","A assinatura de Leonardo no canto da tela","Um raio X feito no próprio hotel","Um certificado entregue pelo vendedor"]}],
[{doc:"Segunda-feira, 8 de agosto de 2005: ao abrir a caixa-forte, os funcionários encontraram sumido o dinheiro em notas de R$ 50, cerca de 3,5 toneladas. As portas e os alarmes estavam intactos. No piso da caixa-forte, a polícia achou uma abertura na laje de concreto.",q:"O que a falta de arrombamento nas portas e a abertura no piso indicam?",o:["A entrada foi feita por baixo, sem passar pelas portas","Um funcionário abriu as portas e as fechou depois","O alarme foi desligado por um hacker","O dinheiro saiu num carro-forte dias antes"]},
{doc:"Perícia da Polícia Federal: a abertura dava num túnel de quase 80 metros, com ventilação, iluminação e escoras de madeira, que saía numa casa alugada perto do banco. Ali funcionava uma empresa de venda de grama sintética, com placa na frente. Havia uma parede falsa de sacos de areia.",q:"Qual era a função da empresa de grama sintética?",o:["Disfarçar a entrada de material e a saída de terra do túnel","Lavar o dinheiro depois do roubo","Servir de álibi ao dono da casa","Vender ao banco o material da caixa-forte"]},
{doc:"Investigação: a quadrilha planejou o crime por cerca de três meses e contou com informações internas de alguém ligado ao banco. Chegou à laje da caixa-forte em 4 de agosto. O roubo só foi descoberto na segunda-feira, e o dinheiro já tinha seguido para pelo menos três destinos, um deles um bairro da periferia, onde parte foi enterrada.",q:"Para que serviu a informação interna?",o:["Para saber onde escavar e chegar à caixa-forte com precisão","Para abrir a porta principal à noite","Para desligar as câmeras à distância","Para trocar o dinheiro por notas falsas"]},
{doc:"Evidências: ao fim das investigações, dezenas de pessoas foram presas e só uma parte do dinheiro foi recuperada (as fontes divergem, de cerca de R$ 20 a R$ 60 milhões). O suposto engenheiro do túnel ficou foragido por anos antes de ser capturado.",q:"Por que recuperar o dinheiro foi tão difícil?",o:["Ele foi dividido em vários destinos, e parte foi enterrada e gasta","Todas as notas foram devolvidas ao banco pelos ladrões","O banco nunca informou o valor roubado","Os ladrões queimaram quase tudo"]}],
[{doc:"24 de novembro de 1971, voo 305 da Northwest Orient, Portland-Seattle, Boeing 727. Um homem de terno e gravata preta, sob o nome Dan Cooper, entrega um bilhete a uma comissária dizendo ter uma bomba na maleta. Pede US$ 200 mil em notas de 20, quatro paraquedas e combustível em Seattle. Em Seattle, solta os passageiros e manda decolar de novo, voando baixo e devagar, com o trem de pouso baixado.",q:"O que o pedido de voar baixo e devagar, com o trem de pouso baixado, permitia?",o:["Saltar com mais segurança pela escada traseira do 727","Escapar dos radares","Economizar combustível até o México","Impedir que o avião pousasse sozinho"]},
{doc:"Laudo do FBI: o avião foi tratado como cena de crime e cerca de 66 impressões digitais latentes foram colhidas, sem identificar o suspeito. Cooper deixou na poltrona uma gravata de pressão com prendedor de pérola. Análises posteriores acharam partículas metálicas na gravata.",q:"Por que a gravata é uma evidência tão importante?",o:["Era um dos poucos objetos pessoais dele, possível fonte de DNA e de pistas","Tinha o nome de Cooper gravado","Foi comprada por ele no mesmo dia","Era de uma marca vendida só no Japão"]},
{doc:"Investigação: o FBI examinou mais de mil suspeitos. Richard McCoy sequestrou outro avião em 1972 e saltou com US$ 500 mil, mas na data do voo 305 estava em casa com a família, segundo o FBI.",q:"Por que McCoy foi descartado como Cooper?",o:["Ele tinha álibi: estava em casa na data do sequestro","Estava preso na época","Suas digitais não bateram com as do avião","Morreu antes do voo"]},
{doc:"Evidências: em 1980, um menino de 8 anos achou cerca de US$ 5.800 em notas de 20, apodrecidas, na margem do rio Columbia, em Tena Bar. Os números de série batiam com os do resgate. Um dos paraquedas também foi achado no estado de Washington. Nenhum corpo foi encontrado.",q:"O que o achado do dinheiro prova com segurança?",o:["Que parte do dinheiro chegou à região, mas não que Cooper sobreviveu","Que Cooper sobreviveu e gastou o resto","Que Cooper morreu afogado","Que o dinheiro era falso"]}],
[{doc:"Sexta-feira de Carnaval, 24 de fevereiro de 2006, por volta das 14h. Quatro homens entraram no museu da Chácara do Céu, em Santa Teresa, enquanto um bloco de rua tomava o bairro. Renderam os seguranças, fizeram cerca de nove turistas de reféns e mandaram desligar as câmeras. Um deles subiu num móvel e cortou com uma faca os fios de náilon que prendiam um quadro. Em cerca de meia hora, saíram.",q:"Por que o Carnaval foi uma vantagem para os ladrões?",o:["A multidão e o barulho dificultavam a ação da polícia e escondiam a fuga","O museu estava fechado ao público","Os seguranças estavam de folga","As câmeras só funcionam à noite","O bloco de rua foi organizado pelos ladrões"]},
{doc:"Dias depois, após um telefonema anônimo, a polícia achou no morro dos Prazeres, a menos de um quilômetro do museu, restos queimados de gesso e madeira das molduras de três quadros, com um pedaço de tecido queimado que trazia o número de registro de uma das telas no museu. As telas não estavam ali.",q:"O que o achado das molduras queimadas indica?",o:["As telas foram tiradas das molduras logo após o roubo, perto do museu","As telas foram queimadas junto com as molduras","Os ladrões moravam dentro do museu","Os quadros eram falsos","O museu queimou as molduras para sumir com provas"]},
{doc:"A primeira linha de investigação envolveu o dono de uma Kombi branca, na qual ao menos uma obra teria sido transportada. A polícia suspeitava que ele fosse cúmplice dos quatro assaltantes. Em 1989, o mesmo museu já havia sido roubado, e duas das mesmas obras, de Matisse e de Dalí, foram levadas e depois achadas num apartamento no Rio. A polícia também divulgou o retrato de um francês suspeito.",q:"O que o roubo de 1989 mostra sobre o museu?",o:["Já havia sido alvo antes, e duas das mesmas obras foram levadas de novo","Nunca tinha sofrido um roubo antes","Todas as obras de 1989 foram perdidas","Em 1989 foi só um assalto sem obras levadas","Em 1989 os ladrões foram condenados e a segurança foi reforçada"]},
{doc:"Cinco obras foram levadas: um Dalí, um Matisse, um Monet e dois Picassos, avaliados em mais de US$ 10 milhões. Nenhuma foi recuperada. O FBI listou o caso entre os maiores roubos de arte do mundo. Passados 20 anos, o crime prescreveu em fevereiro de 2026, e os responsáveis não poderão mais ser punidos.",q:"Qual é a situação do caso hoje?",o:["Nenhuma obra foi achada, o caso nunca foi solucionado e o crime prescreveu","As obras voltaram e os ladrões foram condenados","Os ladrões foram condenados, mas as obras sumiram","As obras foram achadas num leilão e devolvidas ao museu","O caso foi arquivado porque os quadros eram falsos"]}],
[{doc:"7 de setembro de 1978, aniversário do líder comunista da Bulgária. Na ponte Waterloo, em Londres, Georgi Markov, jornalista da BBC e opositor do regime, espera o ônibus e sente uma picada na coxa. Um homem pega um guarda-chuva do chão e se afasta.",q:"Por que a data do ataque chama atenção?",o:["Era o aniversário do líder búlgaro que Markov criticava","Era o aniversário de Markov","Era o dia em que ele se mudou para Londres","Era a estreia de uma peça dele"]},
{doc:"Autópsia: Markov teve febre alta, pulso acelerado e pressão baixa e morreu em 11 de setembro. Na coxa, o perito David Gall, de Porton Down, achou uma esfera metálica do tamanho de uma cabeça de alfinete, com dois furos. Não havia teste confiável para ricina, que o corpo degrada rápido.",q:"Como os peritos concluíram que o veneno era ricina?",o:["Injetaram ricina num porco e viram danos iguais aos de Markov","Mediram ricina no sangue de Markov","A esfera tinha o rótulo do veneno","O autor confessou"]},
{doc:"Investigação: dez dias antes, em Paris, o jornalista búlgaro Vladimir Kostov sentiu uma picada nas costas no metrô. Ele sobreviveu, e a esfera achada nele era idêntica à de Markov.",q:"Por que o caso de Kostov foi decisivo?",o:["Mostrou o mesmo método e ligou os ataques a uma operação planejada","Provou que o autor morava em Paris","Mostrou que Kostov era o culpado","Encerrou a investigação"]},
{doc:"Evidências: arquivos da polícia secreta búlgara, revelados depois, apontam um agente de codinome Piccadilly, treinado e premiado após a morte. Um suspeito foi interrogado na Dinamarca em 1993 e nunca foi acusado. Em 2013, a Bulgária encerrou a investigação sem identificar, acusar ou prender ninguém.",q:"Qual é a situação oficial do caso?",o:["Arquivado em 2013, sem acusados","O autor foi condenado em Londres","O autor confessou em 1990","Foi declarado acidente"]}],
[{doc:"29 de setembro de 1982: uma menina de 12 anos morre em Elk Grove Village. Cerca de uma hora depois, um carteiro de 27 anos morre em Arlington Heights, a cerca de 11 km, e outros familiares passam mal. As vítimas não se conheciam e moravam em cidades diferentes.",q:"O que a distância entre as vítimas sugere sobre onde o veneno foi colocado?",o:["Em vários pontos de venda, e não na casa das vítimas","Num único hospital","Na casa de uma só vítima","Na água da cidade"]},
{doc:"Análise do laboratório de saúde de Chicago: de milhares de frascos e cerca de 80 mil cápsulas, algumas continham cianeto de potássio. Os frascos adulterados pertenciam a lotes diferentes, feitos em fábricas diferentes.",q:"O que lotes e fábricas diferentes indicam?",o:["A adulteração ocorreu depois que os frascos saíram da fábrica","Uma falha de produção numa só fábrica","Um ingrediente contaminado do mesmo fornecedor","Um erro de rotulagem"]},
{doc:"Investigação: a fabricante recebeu uma carta exigindo US$ 1 milhão para parar as mortes. O autor, James Lewis, foi preso, admitiu a carta e disse que não pretendia receber o dinheiro. Sempre negou os envenenamentos e foi condenado por extorsão.",q:"Por que Lewis não foi condenado pelas mortes?",o:["Faltavam provas ligando-o aos envenenamentos","Ele provou um álibi em tribunal","A carta foi escrita depois de ele ser preso","O júri o declarou inocente do assassinato"]},
{doc:"Evidências: em 5 de outubro, a fabricante recolheu cerca de 31 milhões de frascos. Só as cápsulas haviam sido adulteradas. O culpado pelos envenenamentos nunca foi identificado. O caso levou a lacres e embalagens invioláveis e a leis federais contra adulteração de produtos.",q:"Qual foi a consequência mais duradoura do caso?",o:["Embalagens invioláveis e leis contra adulteração de produtos","O produto foi banido para sempre","O culpado foi preso em 1990","A fábrica foi fechada"]}]];

{t:"O Casal do Navio",y:1910,l:"Londres",d:6,s:"Em 1910, a esposa de um médico americano em Londres deixou de ser vista depois de uma festa em casa. O marido disse que ela voltara para os Estados Unidos. Semanas depois, um policial voltou à casa e, dessa vez, achou algo no subsolo.",
q:[["A mulher foi vista viva depois da festa?",0],["O marido deu uma explicação à polícia?",1],["O marido ficou na cidade depois da primeira visita?",0],["Uma amante estava envolvida?",1],["A amante usava roupas da desaparecida?",1],["Algo foi encontrado no subsolo?",1],["O corpo foi achado completo?",0],["O marido foi preso em Londres?",0],["A casa ficava perto do rio?",2]],
r:"O médico Hawley Crippen foi condenado pela morte da esposa, Cora, cujos restos foram achados no porão. Ele fugiu de navio com a amante, Ethel Le Neve, vestida de rapaz. O capitão os reconheceu e avisou a polícia por telégrafo sem fio, a primeira vez que o rádio ajudou a prender um suspeito.",
w:["A esposa fugiu com um amante, e o corpo achado era de um ladrão que invadiu a casa.","O médico a envenenou num jantar e se entregou ao saber que a polícia voltaria.","Ela foi morta por um inquilino, e o médico fugiu por medo de ser acusado injustamente.","O médico fingiu a morte da esposa para receber um seguro e foi achado em Paris por um detetive."]},
{t:"Monopoly dos Ladrões",y:1963,l:"Inglaterra",d:6,s:"Em 1963, quinze homens pararam um trem de correio na madrugada e levaram sacos de dinheiro em poucos minutos. A polícia não tinha pistas, até achar a casa de campo onde eles se esconderam e o que deixaram sobre a mesa.",
q:[["Os ladrões usaram armas de fogo contra a tripulação?",0],["Alguém ficou ferido?",1],["O trem foi parado por um sinal adulterado?",1],["Os ladrões escaparam sem deixar rastro?",0],["Eles se esconderam numa fazenda?",1],["Um vizinho desconfiou da fazenda?",1],["Os ladrões queimaram a casa antes de fugir?",0],["O dinheiro era em notas grandes?",0],["O trem era azul?",2]],
r:"A quadrilha parou o trem cobrindo a luz verde de um sinal com uma luva e ligando uma lâmpada vermelha a uma bateria. Levou cerca de 2,6 milhões de libras e se escondeu na fazenda Leatherslade. Ali jogaram Monopoly com dinheiro de verdade e deixaram digitais no tabuleiro e num frasco de ketchup, o que levou à prisão da maioria.",
w:["Um dos ladrões entregou os demais em troca de perdão, sem nenhuma prova material.","Uma câmera da estação filmou os rostos de todos, e a polícia os identificou.","O dinheiro tinha números de série anotados e foi rastreado quando tentaram gastá-lo.","Um maquinista cúmplice foi preso e denunciou o esconderijo."]},
{t:"81 Minutos",y:1990,l:"Boston, EUA",d:6,s:"Na madrugada seguinte a uma festa popular, dois homens bateram à porta de um museu de arte e se identificaram como policiais. Pouco mais de uma hora depois, saíram, e na parede ficaram molduras vazias.",
q:[["Eles usaram violência grave contra os seguranças?",0],["Os seguranças foram amarrados?",1],["Os ladrões estavam disfarçados?",1],["Os ladrões entraram arrombando uma janela?",0],["Os seguranças abriram a porta?",1],["Os ladrões levaram tudo o que havia de mais valioso?",0],["Alguém foi condenado?",0],["Os ladrões levaram a fita das câmeras?",1],["Era uma noite de verão?",2]],
r:"Dois homens vestidos de policiais disseram atender a uma ocorrência, e o segurança abriu a porta. Eles amarraram os dois seguranças com fita adesiva no porão, passaram 81 minutos levando 13 obras (entre elas um Vermeer e Rembrandts) e levaram a fita das câmeras. O caso continua sem solução, e as molduras seguem vazias.",
w:["Os ladrões eram dois funcionários do museu, presos dias depois com as obras.","Os ladrões arrombaram uma janela dos fundos e desligaram o alarme com um código roubado.","Os seguranças eram cúmplices e foram condenados, e as obras foram devolvidas depois.","As obras foram recuperadas anos depois num depósito, e as molduras são só um memorial."]});

[{doc:"Inspetor Walter Dew visitou a casa em 8 de julho e aceitou a história do médico. No dia seguinte, o médico e a secretária sumiram. Dew voltou e, numa busca de dois dias, soltou tijolos do piso do porão. Debaixo deles havia restos humanos sem cabeça, membros nem esqueleto.",q:"Por que a primeira busca não achou os restos?",o:["Estavam enterrados sob o piso do porão, e a busca foi superficial","Os restos foram levados e depois devolvidos","O crime ainda não havia acontecido","A polícia só procurou no jardim","Os tijolos do piso estavam intactos e nada foi mexido"]},
{doc:"O patologista Bernard Spilsbury, no seu primeiro grande caso, achou nos restos hioscina, um sedativo venenoso. Uma peça de pele do abdômen tinha o que ele e colegas descreveram como cicatriz de cirurgia, compatível com uma operação de Cora. Junto aos restos havia um casaco de pijama, rastreado até um fabricante de 1908.",q:"Por que o casaco de pijama era importante?",o:["Situava o enterro depois de 1908, enquanto os Crippen viviam na casa","Tinha o nome de Cora bordado","Provava que o pijama era de Ethel","Indicava que o corpo era de um inquilino","Tinha manchas de veneno"]},
{doc:"Dew foi a Liverpool e embarcou num navio mais rápido. Enquanto isso, o capitão Henry Kendall, do Montrose, estranhou um passageiro cujo filho vestia roupas largas e andava de mãos dadas com ele, e comparou os dois com fotos de jornal. Kendall mandou um telegrama sem fio antes de sair do alcance do transmissor. Os dois viajavam sob o nome de Robinson.",q:"Que detalhe levou o capitão a desconfiar?",o:["O jovem filho, de roupas mal ajustadas, e o jeito do casal","O passageiro pagou a passagem em dinheiro vivo","O capitão recebeu aviso da polícia antes da partida","O passageiro carregava uma maleta com veneno","A secretária assinou com o nome verdadeiro"]},
{doc:"Crippen foi condenado em 1910 e enforcado em novembro. Ethel foi julgada à parte e absolvida. Em 2007, exames de DNA mitocondrial em amostras guardadas desde 1910 não bateram com parentes maternos de Cora e indicaram que a pele era de um homem. Os resultados foram contestados.",q:"O que os exames de 2007 provam de forma segura?",o:["Que a amostra guardada pode não ser de Cora, mas o caso segue em discussão","Que Crippen era inocente","Que Cora estava viva em 1910","Que a polícia trocou a amostra de propósito","Que o patologista falsificou o laudo"]}],
[{doc:"Pouco depois das 3h de 8 de agosto de 1963, o maquinista Jack Mills parou o trem Glasgow-Londres num sinal vermelho perto de Cheddington. A luz verde estava coberta por uma luva, e uma bateria acendia a luz vermelha. Os ladrões cortaram os fios do telefone da linha, dominaram a tripulação e feriram Mills na cabeça. Em cerca de quinze minutos, uma corrente humana passou 120 sacos de dinheiro para os veículos.",q:"Por que o sinal vermelho falso foi decisivo?",o:["Fez o trem parar num ponto escolhido, perto de uma ponte e de estradas de fuga","Fez o maquinista abrir a porta do vagão","Avisou a polícia local de que havia um problema","Cortou a energia de todo o trem","Impediu o alarme de funcionar"]},
{doc:"Os peritos encontraram veículos dos ladrões na fazenda e, dentro da casa, impressões digitais em objetos comuns: um tabuleiro de Monopoly e um frasco de ketchup. Os ladrões tinham tentado limpar os vestígios, mas esqueceram marcas em objetos que tocaram sem pensar.",q:"Por que as digitais em objetos comuns foram tão incriminadoras?",o:["Eles limparam superfícies óbvias e esqueceram objetos que tocaram sem pensar","As digitais eram de policiais que invadiram a casa","O tabuleiro era do dono da fazenda","O ketchup era evidência de veneno","Os objetos foram plantados pela polícia"]},
{doc:"O fazendeiro vizinho, John Maris, achou estranhas as janelas escurecidas da casa, e a polícia recebeu denúncias. Os ladrões planejavam ficar alguns dias e queimar a casa antes de partir. Cedo, ouviram no rádio uma notícia sobre a polícia vasculhar fazendas da região e foram embora às pressas, sem apagar todos os vestígios.",q:"O que explica os vestígios deixados na fazenda?",o:["A fuga apressada depois de ouvirem a notícia no rádio","Eles queriam ser presos","O plano nunca incluía limpar nada","Foram traídos por um cúmplice","Foi erro do perito"]},
{doc:"Onze homens foram presos ao longo dos anos, com penas de até 30 anos. O mentor, Bruce Reynolds, só foi preso em 1968. Quase todo o dinheiro nunca foi recuperado. O maquinista Mills voltou ao trabalho em tarefas leves e nunca superou o trauma.",q:"Qual foi o saldo da investigação?",o:["A maioria foi presa por digitais e pistas, mas quase todo o dinheiro sumiu","Todo o dinheiro voltou ao correio","Ninguém foi preso por falta de provas","O mentor foi preso na mesma semana","O maquinista foi punido por cumplicidade"]}],

  :`<button class="card ${st}" data-i="${k}"><span class="img">${IMG[k]}</span><span class="meta"><span class="gold">${star(k)}</span> ${c.y}</span><strong>${c.t}</strong><span class="tz">${c.s.split(". ")[0].replace(/\.$/,"")}.</span><span class="st">${st=="done"?"Resolvido":"Investigar"}</span></button>`;
 });
 s+=`</div><p class="meta">Resolvidos: ${solved.length} de ${ST.length}. Baseado em relatos públicos. As imagens são ilustrações, não fotos dos casos.</p>`+(solved.length>=ST.length?`<p class="stamp">TODOS RESOLVIDOS</p><br>`:"")+`<button class="btn ghost" id="rs">Zerar progresso</button>`;
 app.innerHTML=s;
 $("#go").onclick=e=>{e.preventDefault();$("#deck").scrollIntoView({behavior:"smooth"})};
 app.querySelectorAll("button.card").forEach(n=>n.onclick=()=>play(+n.dataset.i));
 $("#rs").onclick=()=>{if(confirm("Apagar todo o progresso?")){solved=[];save();map()}};
}
function play(i){
 window.scrollTo(0,0);
 const S=ST[i],P=PH[i],N=["Não","Sim","Irrelevante"];
 let ph=0,lives=3,busy=false;const taken=new Set();
 const order=sh(S.q);
 app.innerHTML=`<div class="top"><button class="btn ghost" id="bk">Voltar</button><span class="meta" id="lv"></span></div>
 <div class="himg">${IMG[i]}</div><h2>${S.t}</h2><p class="meta"><span class="gold">${star(i)}</span> Fato real: ${S.l}, ${S.y}</p>
 <div class="steps" id="st"></div><h3 id="pn"></h3><div id="cl"></div><div id="pk"></div><div id="log" aria-live="polite"></div><div id="qa"></div><p class="hint" id="ht" role="status"></p>`;
 $("#bk").onclick=map;
 const hearts=()=>$("#lv").textContent="Vidas: "+"♥".repeat(lives)+"♡".repeat(3-lives);
 const head=()=>{hearts();$("#st").innerHTML=PN.map((n,k)=>`<i class="${k<ph?"d":k==ph?"c":""}" title="${n}"></i>`).join("");$("#pn").textContent=`Fase ${ph+1} de 6: ${PN[ph]}`;if(ph>0)setTimeout(()=>$("#pn").scrollIntoView({behavior:"smooth",block:"start"}),60)};
 function go(){
  busy=false;head();$("#ht").textContent="";
  if(ph==0){
   $("#cl").innerHTML=`<p class="clue"><b>Relato inicial</b>${S.s}</p>`;
   picker(order);$("#qa").innerHTML=`<button class="btn" id="nx">Ir para a cena do crime</button>`;$("#nx").onclick=()=>{ph=1;go()};return;
  }
  if(ph<5){
   $("#cl").insertAdjacentHTML("beforeend",`<p class="clue"><b>${PN[ph]}</b>${P[ph-1].doc}</p>`);
   {const pl=PX[i][ph-1];picker(pl.length>6?sh(pl).slice(0,6):pl)}quiz(P[ph-1].q,P[ph-1].o[0],P[ph-1].o);return;
  }
  picker(order.filter(q=>!taken.has(q)));
  quiz("O que realmente aconteceu?",S.r,[S.r,...S.w]);
 }
 function picker(pool){
  let used=0;const box=$("#pk");
  const draw=()=>{
   box.innerHTML=`<p class="q">Escolha até 3 perguntas (restam ${3-used}). A resposta é só Sim, Não ou Irrelevante.</p><div class="qs">${pool.map((q,k)=>`<button class="q" data-k="${k}"${used>=3||taken.has(q)?" disabled":""}>${q[0]}</button>`).join("")}</div>`;
   box.querySelectorAll(".q").forEach(b=>b.onclick=()=>{const q=pool[+b.dataset.k];taken.add(q);used++;
    $("#log").insertAdjacentHTML("beforeend",`<p class="ans a${q[1]}"><b>${N[q[1]]}</b><span>${q[0]}</span></p>`);draw()});
  };
  draw();
 }
 function quiz(q,ok,opts){
  const o=sh(opts);
  $("#qa").innerHTML=`<p class="q">${q}</p>`+o.map((t,k)=>`<button class="opt" data-k="${k}">${t}</button>`).join("");
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   if(busy)return;const t=o[+b.dataset.k];
   if(t==ok){busy=true;b.classList.add("ok");
    if(ph==5){win();return}
    ph++;$("#qa").insertAdjacentHTML("beforeend",`<button class="btn" id="nx">Próxima fase</button>`);$("#nx").onclick=go;$("#nx").focus();return}
   b.classList.add("bad");b.disabled=true;lives--;hearts();
   if(lives<=0){busy=true;lose();return}
   $("#ht").textContent="Errado: você perdeu uma vida. Releia o caderno de pistas.";
  });
 }
 function win(){
  if(!solved.includes(i)){solved.push(i);save()}
  $("#st").innerHTML=PN.map(()=>`<i class="d"></i>`).join("");$("#lv").textContent="";
  $("#qa").insertAdjacentHTML("beforeend",`<p class="stamp">CASO RESOLVIDO</p><p>${S.r}</p>${i<ST.length-1?`<button class="btn" id="nc">Próxima carta</button>`:""}<button class="btn ghost" id="mp">Voltar às cartas</button>`);
  const n=$("#nc");if(n){n.onclick=()=>play(i+1);n.focus({preventScroll:true})}$("#mp").onclick=map;$(".stamp").scrollIntoView({behavior:"smooth",block:"center"});
 }
 function lose(){
  $("#qa").insertAdjacentHTML("beforeend",`<p class="stamp l">CASO PERDIDO</p><p>As vidas acabaram e o caso foi arquivado. Recomece da primeira fase.</p><button class="btn" id="rt">Recomeçar o caso</button><button class="btn ghost" id="mp">Voltar às cartas</button>`);
  $("#rt").onclick=()=>play(i);$("#mp").onclick=map;$("#rt").focus();
 }
 go();
}
map();
</script>
</body>
</html>
